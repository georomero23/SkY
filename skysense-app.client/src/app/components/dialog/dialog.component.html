

<c-modal [visible]="visible" (visibleChange)="visible = $event">
  <c-modal-header>
    <h5 cModalTitle>{{ title }}</h5>
    <button cButtonClose (click)="onNo()"></button>
  </c-modal-header>
  <c-modal-body>
    <div>{{ message }}</div>
  </c-modal-body>
  <c-modal-footer>
    <button cButton color="secondary" (click)="onNo()">No</button>
    <button cButton color="danger" (click)="onYes()">Sí</button>
  </c-modal-footer>
</c-modal>
