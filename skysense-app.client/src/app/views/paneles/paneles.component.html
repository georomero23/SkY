<c-card class="mb-4">
    <c-card-header>
      <div class="d-flex justify-content-between align-items-center">
        <div>
            Paneles
          </div>
          <div>
            <form (submit)="ObtenerPaneles(1)">
            <c-input-group>
              <input aria-label="Busqueda de instalaciones"
                    cFormControl
                    placeholder="Marca | Modelo | No. Serie" name="inpInv" [(ngModel)]="buscador"
              />
              <button cButton color="secondary" type="button" variant="outline" (click)="buscador = '';ObtenerPaneles(1)">
                X
              </button>
              <button cButton color="primary" type="button" variant="outline" (click)="ObtenerPaneles(1)">
                Buscar
              </button>
            </c-input-group></form>
          </div>
      </div>
    </c-card-header>
    <c-card-body>
      <table cTable>
        <thead>
          <tr>
            <th scope="col">Instalación</th>
            <th scope="col">Marca</th>
            <th scope="col">Modelo</th>
            <th scope="col">Número de serie</th>
            <th scope="col">Potencia kWh</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let panel of _panelesPaginados.registros">
            <td><a [routerLink]="['/clientes', panel.idCliente, panel.idInstalacion]">{{ panel.instalacion }}</a></td>
            <!-- <td><a [href]="'#/clientes/' + panel.idCliente + '/' + panel.idInstalacion">{{ panel.instalacion }}</a></td> -->
            <td>{{ panel.marca }}</td>
            <td>{{ panel.modelo }}</td>
            <td>{{ panel.numeroSerie }}</td>
            <td>{{ panel.potencia }}</td>
          </tr>
        </tbody>
      </table>
      <app-mi-paginador (onPaginaCambiada)="ObtenerPaneles($event)" [paginado]="_panelesPaginados"></app-mi-paginador>
    </c-card-body>
</c-card>
